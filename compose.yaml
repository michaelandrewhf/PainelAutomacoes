services:
  app:
    build:
      context: .
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - .:/app
      - automation_data:/app/data
      - ${GOOGLE_CREDENTIALS_FILE:?configure GOOGLE_CREDENTIALS_FILE no .env}:/run/secrets/google_credentials.json:ro
      - ${GOOGLE_TOKEN_FILE:?configure GOOGLE_TOKEN_FILE no .env}:/run/secrets/google_token.json:ro
      - ${DRIVE_UPDATE_GOOGLE_CREDENTIALS_FILE:?configure DRIVE_UPDATE_GOOGLE_CREDENTIALS_FILE no .env}:/run/secrets/drive_update_credentials.json:ro
    env_file:
      - .env
    environment:
      FLASK_APP: app
      FLASK_DEBUG: "0"
      DATABASE_PATH: /app/data/automations.db
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      GOOGLE_CREDENTIALS_FILE: /run/secrets/google_credentials.json
      GOOGLE_TOKEN_FILE: /run/secrets/google_token.json
      DRIVE_UPDATE_GOOGLE_CREDENTIALS_FILE: /run/secrets/drive_update_credentials.json
      UV_PROJECT_ENVIRONMENT: /opt/venv
    command: uv run gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 4 app:app
    restart: unless-stopped

volumes:
  automation_data:
