<!doctype html>
<html lang="pt-BR" class="h-full bg-slate-950">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acesso restrito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body class="min-h-full bg-slate-950 text-slate-100 antialiased">
    <main class="flex min-h-screen items-center justify-center px-4 py-10">
      <section class="w-full max-w-md rounded-lg border border-white/10 bg-slate-900/90 p-6 shadow-2xl shadow-black/30">
        <p class="text-sm font-medium uppercase tracking-[0.16em] text-cyan-300">Painel de Automações</p>
        <h1 class="mt-3 text-2xl font-semibold text-white">Acesso restrito</h1>

        {% if error_message %}
          <div class="mt-5 rounded-md border border-red-400/30 bg-red-500/10 px-3 py-2 text-sm text-red-100" role="alert">
            {{ error_message }}
          </div>
        {% endif %}

        <form class="mt-6 grid gap-4" method="post" action="{{ url_for('login_post') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

          <div>
            <label for="username" class="block text-sm font-medium text-slate-200">Usuário</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
              autofocus
              class="mt-2 block h-11 w-full rounded-md border border-white/10 bg-slate-950 px-3 text-sm text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-cyan-300"
            >
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-slate-200">Senha</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="mt-2 block h-11 w-full rounded-md border border-white/10 bg-slate-950 px-3 text-sm text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-cyan-300"
            >
          </div>

          <button
            type="submit"
            class="mt-2 inline-flex h-11 items-center justify-center rounded-md bg-cyan-400 px-4 text-sm font-semibold text-slate-950 transition hover:bg-cyan-300"
          >
            Entrar
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
